<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Model Stove · 模型灶台 — 本地模型启动器</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --line: #2d323c;
    --text: #e6e8ec;
    --dim: #8b93a1;
    --accent: #4c8dff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------- 侧栏 */
  #side {
    width: 320px; flex: 0 0 320px; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  #side h1 {
    font-size: 14px; margin: 0; padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line); font-weight: 600; letter-spacing: .3px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  #side h1 .titles { flex: 1; min-width: 0; }
  #side h1 small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; margin-top: 3px; }
  #btnSettings {
    flex: 0 0 auto; width: 26px; height: 26px; padding: 0; line-height: 1;
    font-size: 14px; border-radius: 6px;
  }
  #btnSettings.on { border-color: var(--accent); background: #1e2734; }

  #settings { border-bottom: 1px solid var(--line); background: #171a1f; }
  #settings.hidden { display: none; }
  #settings .inner { padding: 12px 14px; }
  #settings .opt {
    display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
    padding: 7px 9px; border-radius: 6px;
  }
  #settings .opt:hover { background: rgba(128,128,128,.08); }
  #settings .opt input { margin: 2px 0 0; cursor: pointer; }
  #settings .opt .txt { flex: 1; }
  #settings .opt .txt b { font-weight: 500; }
  #settings .opt .txt span { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }

  .scroll { overflow-y: auto; flex: 1; }
  .group { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .group.hidden { display: none; }
  .group > .label {
    color: var(--dim); font-size: 11px; letter-spacing: .6px; margin-bottom: 8px;
  }

  .item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel-2); border: 1px solid transparent; border-radius: 7px;
    color: var(--text); padding: 9px 11px; margin-bottom: 6px; font: inherit;
  }
  .item:hover { border-color: #3a4150; }
  .item.sel { border-color: var(--accent); background: #1e2734; }
  .item .t { font-weight: 500; }
  .item .d { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .item.missing { opacity: .45; cursor: not-allowed; }
  .item.missing .d { color: var(--warn); }

  #controls { padding: 12px 14px; border-top: 1px solid var(--line); }
  button {
    width: 100%; padding: 10px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer;
    font-weight: 500;
  }
  button:hover:not(:disabled) { border-color: #3a4150; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #3d7ce8; }
  button.danger { background: #3a2020; border-color: #5a2b2b; color: #ffb4b4; }

  /* ---------------------------------------------------------------- 状态 */
  #status { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .row .k { color: var(--dim); }
  .row .v { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.busy { background: var(--warn); }
  .dot.err { background: var(--err); }

  /* ---------------------------------------------------------------- 主区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar {
    height: 38px; flex: 0 0 38px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel);
    font-size: 12px; color: var(--dim);
  }
  #bar .spacer { flex: 1; }
  #bar button { width: auto; padding: 5px 11px; font-size: 12px; font-weight: 400; }
  #stage { flex: 1; position: relative; background: #0f1114; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #frame.hidden { display: none; }

  #placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; color: var(--dim);
    text-align: center; padding: 40px;
  }
  #placeholder.hidden { display: none; }
  #placeholder .big { font-size: 34px; opacity: .35; }
  #placeholder code {
    background: var(--panel-2); padding: 2px 6px; border-radius: 4px;
    color: #c9d1d9; font-size: 12px;
  }

  /* ---------------------------------------------------------------- 日志 */
  #logwrap { flex: 0 0 auto; border-top: 1px solid var(--line); background: #101216; display: none; }
  #logwrap.show { display: block; }
  #log {
    height: 170px; overflow-y: auto; margin: 0; padding: 8px 12px;
    font: 11.5px/1.55 Consolas, "Cascadia Mono", monospace; color: #9fb0c4;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>

<aside id="side">
  <h1>
    <div class="titles">Model Stove 模型灶台
      <small>本地模型启动器 · llama-server 图形外壳</small>
    </div>
    <button id="btnSettings" title="外壳设置">⚙</button>
  </h1>

  <div id="settings" class="hidden">
    <div class="inner">
      <label class="opt">
        <input type="checkbox" id="optReasoning" />
        <span class="txt">
          <b>显示思考强度选择器</b>
          <span>开启后侧栏多一栏,可固定「服务级」思考档位。关闭时外壳不传
            <code>--reasoning-effort</code>,完全交给聊天界面里那个按对话设置的档位。</span>
        </span>
      </label>
    </div>
  </div>

  <div class="scroll">
    <div class="group">
      <div class="label">模型</div>
      <div id="models"></div>
    </div>
    <div class="group">
      <div class="label">运行预设</div>
      <div id="presets"></div>
    </div>
    <div class="group hidden" id="reasoningGroup">
      <div class="label">思考强度</div>
      <div id="reasoning"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btnStart" class="primary">启动</button>
    <button id="btnStop" class="danger" style="margin-top:7px" disabled>停止</button>
  </div>

  <div id="status">
    <div class="row"><span class="k">状态</span><span class="v"><span id="dot" class="dot"></span><span id="stText">未运行</span></span></div>
    <div class="row"><span class="k">上下文</span><span class="v" id="stCtx">—</span></div>
    <div class="row"><span class="k">运行时长</span><span class="v" id="stUp">—</span></div>
    <div class="row"><span class="k">端口</span><span class="v" id="stPort">—</span></div>
  </div>
</aside>

<main id="main">
  <div id="bar">
    <span id="barText">未连接</span>
    <span class="spacer"></span>
    <button id="btnReload" disabled>重载界面</button>
    <button id="btnOpen" disabled>用浏览器打开</button>
    <button id="btnLog">日志</button>
  </div>

  <div id="stage">
    <webview id="frame" class="hidden" src="about:blank" allowpopups></webview>
    <div id="placeholder">
      <div class="big">◍</div>
      <div>左侧选一个模型和预设,然后点「启动」</div>
      <div style="font-size:12px;max-width:430px">
        界面直接复用 llama.cpp 自带的 Web 聊天页,外壳只负责进程编排。
      </div>
    </div>
  </div>

  <div id="logwrap">
    <pre id="log">(暂无日志)</pre>
  </div>
</main>

<script>
// 说明:webview 刻意**不**跟随状态轮询重新导航。
// 给 src 赋值 —— 哪怕值完全一样 —— 也会让 Electron 发起一次导航,
// 而服务端的界面把每次导航当成一次新会话,于是每隔几秒就多出一个
// "New chat" 标签页。只在真正变化时导航,并记住实际加载过什么。
const $ = (id) => document.getElementById(id);

let CATALOGUE = null;
let selModel = null;
let selPreset = null;
let selReasoning = 'medium';
let busy = false;
let loadedUrl = null;
let frameFailed = false;

const REASONING_STORE_KEY = 'model-stove.reasoning';
const SHOW_REASONING_KEY = 'model-stove.showReasoning';

// 侧栏的「思考强度」默认隐藏。
//
// 聊天界面自己就带一个按对话设置的档位(输入框 + 菜单里的 Reasoning),
// 在这里再放一个「服务级」的容易打架,所以默认关掉 —— 外壳不传
// --reasoning-effort,完全由界面决定。想要服务级固定档位时再打开。
//
// 注意:开启并选定档位后,服务端的 flag 会盖住界面里那个按对话的设置,
// 因为界面里的选择通常以请求参数下发,而服务端 flag 优先级更高。
// 需要按对话调节时,把这里关掉,或选「跟随模型默认」。
function loadShowReasoning() {
  try {
    const v = localStorage.getItem(SHOW_REASONING_KEY);
    if (v === '1') return true;
    if (v === '0') return false;
  } catch (e) { /* 忽略 */ }
  return false;
}
function saveShowReasoning(v) {
  try { localStorage.setItem(SHOW_REASONING_KEY, v ? '1' : '0'); } catch (e) { /* 忽略 */ }
}

function applyReasoningVisibility() {
  const on = loadShowReasoning();
  $('reasoningGroup').classList.toggle('hidden', !on);
  $('optReasoning').checked = on;
}

function fmtUptime(s) {
  if (!s) return '—';
  const m = Math.floor(s / 60);
  return m < 1 ? `${s} 秒` : `${m} 分 ${s % 60} 秒`;
}

function reasonLabel(key) {
  const list = (CATALOGUE && CATALOGUE.reasoning) || [];
  const hit = list.find((r) => r.key === key);
  return hit ? hit.label : (key || '—');
}

// 记住思考强度:它是两次运行之间最可能变化的一项。
function saveReasoning() {
  try { localStorage.setItem(REASONING_STORE_KEY, selReasoning); } catch (e) { /* 忽略 */ }
}
function loadReasoning() {
  try {
    const v = localStorage.getItem(REASONING_STORE_KEY);
    if (v && (CATALOGUE.reasoning || []).some((r) => r.key === v)) return v;
  } catch (e) { /* 忽略 */ }
  return 'server-default';
}

function renderModels() {
  const box = $('models');
  box.innerHTML = '';
  for (const m of CATALOGUE.models) {
    const b = document.createElement('button');
    b.className = 'item' + (m.id === selModel ? ' sel' : '') + (m.present ? '' : ' missing');
    b.innerHTML = `<div class="t">${m.name}</div>
      <div class="d">${m.present ? m.note : '文件缺失:' + m.file}</div>`;
    if (m.present) {
      b.onclick = () => {
        selModel = m.id;
        selPreset = m.defaultPreset;
        renderModels(); renderPresets(); refreshButtons();
      };
    }
    box.appendChild(b);
  }
}

function renderPresets() {
  const box = $('presets');
  box.innerHTML = '';
  for (const p of CATALOGUE.presets) {
    const b = document.createElement('button');
    b.className = 'item' + (p.key === selPreset ? ' sel' : '');
    b.innerHTML = `<div class="t">${p.label}${p.vision ? ' · 视觉' : ''}</div>
      <div class="d">${p.hint}</div>`;
    b.onclick = () => { selPreset = p.key; renderPresets(); refreshButtons(); };
    box.appendChild(b);
  }
}

function renderReasoning() {
  const box = $('reasoning');
  box.innerHTML = '';
  for (const r of (CATALOGUE.reasoning || [])) {
    const b = document.createElement('button');
    b.className = 'item' + (r.key === selReasoning ? ' sel' : '');
    b.innerHTML = `<div class="t">${r.label}</div>
      <div class="d">${r.hint}${r.flag ? ' · --reasoning-effort ' + r.flag : ''}</div>`;
    b.onclick = () => { selReasoning = r.key; saveReasoning(); renderReasoning(); refreshButtons(); };
    box.appendChild(b);
  }
}

function refreshButtons() {
  $('btnStart').disabled = busy || !selModel || !selPreset;
  $('btnStart').textContent = busy ? '启动中…' : '启动';
}

function setDot(cls, text) {
  $('dot').className = 'dot' + (cls ? ' ' + cls : '');
  $('stText').textContent = text;
}

async function refresh() {
  const s = await window.shell.status();
  if (s.running) {
    setDot('on', '运行中');
    $('stCtx').textContent = s.ctx ? s.ctx.toLocaleString() + ' tokens' : '—';
    $('stUp').textContent = fmtUptime(s.uptimeSec);
    $('barText').textContent = `${s.modelName || ''} · ${s.preset || ''}` +
      (s.reasoning ? ` · 思考:${reasonLabel(s.reasoning)}` : '');
    $('btnStop').disabled = false;
    $('btnReload').disabled = false;
    $('btnOpen').disabled = false;
    showFrame(s.url);
  } else {
    setDot(busy ? 'busy' : '', busy ? '启动中' : '未运行');
    $('stCtx').textContent = '—';
    $('stUp').textContent = '—';
    $('barText').textContent = '未连接';
    $('btnStop').disabled = true;
    $('btnReload').disabled = true;
    $('btnOpen').disabled = true;
    hideFrame();
  }
}

function showFrame(url) {
  const f = $('frame');
  $('placeholder').classList.add('hidden');
  f.classList.remove('hidden');
  if (loadedUrl === url) return;          // 已经在显示了,什么都不做
  loadedUrl = url;
  frameFailed = false;
  f.setAttribute('src', url);
}

function hideFrame() {
  const f = $('frame');
  // 只有在真的加载了东西时才导航离开。每轮轮询都重新赋 src
  // 会让 Electron 每次都发起(然后中止)一次导航。
  if (loadedUrl !== null && loadedUrl !== 'about:blank') {
    loadedUrl = 'about:blank';
    frameFailed = false;
    f.setAttribute('src', 'about:blank');
  }
  f.classList.add('hidden');
  $('placeholder').classList.remove('hidden');
}

function initFrameDiagnostics() {
  const f = $('frame');
  f.addEventListener('did-fail-load', (e) => {
    // -3 是 ERR_ABORTED,我们自己把 src 复位成 about:blank 时就会触发,忽略。
    if (e.errorCode === -3) return;
    frameFailed = true;
    $('barText').textContent = '界面加载失败:' + (e.errorDescription || e.errorCode);
  });
  f.addEventListener('did-finish-load', () => {
    if (frameFailed) { frameFailed = false; refresh(); }
  });
}

async function doStart() {
  busy = true; refreshButtons(); setDot('busy', '启动中');
  // 选择器隐藏时不传思考档位,让界面自己控制。
  const reasoning = loadShowReasoning() ? selReasoning : null;
  const r = await window.shell.start(selModel, selPreset, reasoning);
  busy = false; refreshButtons();
  if (!r.ok) {
    setDot('err', '启动失败');
    $('barText').textContent = '启动失败';
    await showLogs();
    alert('启动失败:\n\n' + r.error);
    return;
  }
  await refresh();
}

async function doStop() {
  await window.shell.stop();
  await refresh();
}

async function showLogs() {
  const lines = await window.shell.logs();
  $('log').textContent = lines.length ? lines.join('\n') : '(暂无日志)';
  $('logwrap').classList.add('show');
  $('log').scrollTop = $('log').scrollHeight;
}

(async function init() {
  CATALOGUE = await window.shell.catalogue();
  $('stPort').textContent = CATALOGUE.port;
  // 预选第一个可用的模型
  const first = CATALOGUE.models.find((m) => m.present);
  if (first) { selModel = first.id; selPreset = first.defaultPreset; }
  selReasoning = loadReasoning();
  renderModels(); renderPresets(); renderReasoning(); refreshButtons();
  applyReasoningVisibility();
  await refresh();

  $('btnStart').onclick = doStart;
  $('btnStop').onclick = doStop;
  $('btnSettings').onclick = () => {
    const box = $('settings');
    box.classList.toggle('hidden');
    $('btnSettings').classList.toggle('on', !box.classList.contains('hidden'));
  };
  $('optReasoning').onchange = (e) => {
    saveShowReasoning(e.target.checked);
    applyReasoningVisibility();
  };
  $('btnReload').onclick = () => { $('frame').reload(); };
  $('btnOpen').onclick = async () => {
    const s = await window.shell.status();
    if (s.url) window.open(s.url, '_blank');
  };
  $('btnLog').onclick = () => {
    const w = $('logwrap');
    w.classList.toggle('show');
    if (w.classList.contains('show')) showLogs();
  };

  window.shell.onStateChanged(refresh);
  initFrameDiagnostics();
  // 只轮询侧栏状态,这里不碰 webview。
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
